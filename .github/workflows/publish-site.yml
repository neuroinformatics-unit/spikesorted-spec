name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.0.0
          path: release-source

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Render release and dev
        run: |
          cp book/_quarto-release.yml release-source/book/_quarto-release.yml
          quarto render release-source/book --profile release
          quarto render book

      - name: Assemble both versions
        run: |
          mkdir -p published/dev
          cp -a release-source/book/_site/. published/
          cp -a book/_site/. published/dev/
          rm -f published/dev/CNAME

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

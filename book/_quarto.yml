project:
  type: book
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - CNAME

book:
  title: "Electrophysiology Pipeline Plan"
  search: true
  page-navigation: true
  site-url: https://neuroinformatics.dev/spikesorted-spec/dev/
  navbar:
    right:
      - text: dev
        menu:
          - text: "0.0.0"
            href: https://neuroinformatics.dev/spikesorted-spec/
          - text: dev
            href: https://neuroinformatics.dev/spikesorted-spec/dev/
  sidebar:
    title: "Ephys Pipeline<br>Planning"
    style: docked
    collapse-level: 2
  page-footer:
    left: "spikesorted-spec"
    right: "Built with [Quarto](https://quarto.org)."
  chapters:
    - href: index.qmd
      text: "Overview"
    - part: "Specification"
      chapters:
        - href: pipeline-steps.qmd
          text: "Steps"
        - href: config.qmd
          text: "Config"
        - href: outputs.qmd
          text: "Outputs"
        - href: on-disk-structure.qmd
          text: "Project Structure"
    - part: "Python Implementation"
      chapters:
        - href: data-loader.qmd
          text: "Data Loader"
        - href: definitions.qmd
          text: "Definitions"
        - href: implementation.qmd
          text: "Pipeline Steps"
    - roadmap.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-expand: true
    number-sections: false
    fig-align: center
    link-external-newwindow: true
